# Facility hub for the demo: HAPI FHIR R4 server on http://localhost:8080/fhir
# Start:  docker compose -f hub/docker-compose.yml up -d
# The prototype's outbox uploads to it automatically when it is reachable (FHIR_BASE).
services:
  hapi:
    image: hapiproject/hapi:latest
    ports:
      - "8080:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
    restart: unless-stopped
